<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080e; color: #e6faff; font-family: 'Courier New', monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #hud { display: flex; gap: 20px; font-size: 15px; letter-spacing: 2px; }
  #hud b { color: #00e5ff; }
  #board { display: grid; grid-template-columns: repeat(3, var(--s)); grid-template-rows: repeat(3, var(--s)); gap: 8px; --s: min(24vmin, 120px); }
  .cell { font: inherit; font-size: calc(var(--s) * 0.55); font-weight: bold; background: #08111c; color: #e6faff; border: 2px solid #00e5ff44; border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .cell:hover:not(:disabled) { border-color: #00e5ff; }
  .cell:focus-visible { outline: 3px solid #facc15; outline-offset: 2px; }
  .cell.x { color: #00e5ff; } .cell.o { color: #ff4d6d; }
  .cell.win { background: #0d3a2a; border-color: #00ff9d; }
  #msg { min-height: 22px; font-size: 18px; letter-spacing: 2px; }
  .row { display: flex; gap: 10px; }
  button.ctl { font: inherit; font-size: 14px; padding: 9px 18px; color: #05080e; background: #00e5ff; border: 0; border-radius: 6px; cursor: pointer; letter-spacing: 2px; }
  button.ctl.alt { background: #1d3346; color: #e6faff; }
  #help { font-size: 12px; color: #7f97a8; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">YOU (X) <b id="sx">0</b> DRAWS <b id="sd">0</b> <span id="oname">JARVIS</span> (O) <b id="so">0</b></div>
  <div id="board" role="grid" aria-label="Tic Tac Toe board"></div>
  <div id="msg" role="status"></div>
  <div class="row">
    <button class="ctl" id="restart" type="button">RESTART</button>
    <button class="ctl alt" id="mode" type="button">MODE: VS JARVIS</button>
  </div>
  <div id="help">Click a square, or press 1–9 (numpad layout) · R to restart · M to switch mode</div>
</div>
<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board'), msg = document.getElementById('msg');
  const sx = document.getElementById('sx'), so = document.getElementById('so'), sd = document.getElementById('sd');
  const KEYMAP = { Numpad7: 0, Numpad8: 1, Numpad9: 2, Numpad4: 3, Numpad5: 4, Numpad6: 5, Numpad1: 6, Numpad2: 7, Numpad3: 8,
                   Digit7: 0, Digit8: 1, Digit9: 2, Digit4: 3, Digit5: 4, Digit6: 5, Digit1: 6, Digit2: 7, Digit3: 8 };
  let board, turn, over, vsAI = true, wins = { X: 0, O: 0, D: 0 };
  const cells = [...Array(9)].map((_, i) => {
    const b = document.createElement('button');
    b.className = 'cell'; b.type = 'button'; b.setAttribute('aria-label', 'Square ' + (i + 1));
    b.addEventListener('click', () => human(i));
    boardEl.appendChild(b);
    return b;
  });
  const winner = (b) => {
    for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return { who: b[l[0]], line: l };
    return b.every(Boolean) ? { who: 'D', line: [] } : null;
  };
  // Minimax: O maximises, X minimises; depth breaks ties so JARVIS wins fast and loses slow.
  function minimax(b, player, depth) {
    const w = winner(b);
    if (w) return { score: w.who === 'O' ? 10 - depth : w.who === 'X' ? depth - 10 : 0 };
    let best = { score: player === 'O' ? -Infinity : Infinity, move: -1 };
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = player;
      const r = minimax(b, player === 'O' ? 'X' : 'O', depth + 1);
      b[i] = null;
      if (player === 'O' ? r.score > best.score : r.score < best.score) best = { score: r.score, move: i };
    }
    return best;
  }
  function render() {
    board.forEach((v, i) => {
      cells[i].textContent = v || '';
      cells[i].className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
      cells[i].disabled = !!v || over || (vsAI && turn === 'O');
    });
  }
  function finish(w) {
    over = true;
    wins[w.who]++;
    sx.textContent = wins.X; so.textContent = wins.O; sd.textContent = wins.D;
    msg.textContent = w.who === 'D' ? "It's a draw." : w.who === 'X' ? 'X wins!' : (vsAI ? 'JARVIS wins.' : 'O wins!');
    render();
    w.line.forEach(i => cells[i].classList.add('win'));
    document.getElementById('restart').focus();
    parent.postMessage({ jarvisGame: 'gameover', score: wins.X }, '*');
  }
  function play(i) {
    if (over || board[i]) return false;
    board[i] = turn;
    const w = winner(board);
    if (w) { finish(w); return true; }
    turn = turn === 'X' ? 'O' : 'X';
    msg.textContent = vsAI ? (turn === 'X' ? 'Your move.' : 'JARVIS is thinking…') : turn + ' to move.';
    render();
    return true;
  }
  function human(i) {
    if (vsAI && turn === 'O') return;
    if (play(i) && vsAI && !over) setTimeout(() => play(minimax(board.slice(), 'O', 0).move), 280);
  }
  // Test hook: JARVIS's runtime tester reads the game state through this.
  window.jarvisState = () => ({ score: wins.X, gameOver: over, board: board.slice(), turn });
  function reset() {
    board = Array(9).fill(null); turn = 'X'; over = false;
    msg.textContent = vsAI ? 'Your move.' : 'X to move.';
    render();
    cells[4].focus();
  }
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('mode').addEventListener('click', () => {
    vsAI = !vsAI;
    document.getElementById('mode').textContent = vsAI ? 'MODE: VS JARVIS' : 'MODE: 2 PLAYERS';
    document.getElementById('oname').textContent = vsAI ? 'JARVIS' : 'PLAYER 2';
    wins = { X: 0, O: 0, D: 0 }; sx.textContent = so.textContent = sd.textContent = '0';
    reset();
  });
  addEventListener('keydown', e => {
    if (e.code in KEYMAP) { e.preventDefault(); human(KEYMAP[e.code]); }
    else if (e.code === 'KeyR') reset();
    else if (e.code === 'KeyM') document.getElementById('mode').click();
  });
  reset();
  window.focus();
})();
</script>
</body>
</html>
